packages: [ "shared", "server", "src", "cli", "runner", "!dist-npm" ] # dist-npm = staging rilis, BUKAN anggota workspace (ADR-0087)
overrides:
  # Audit 2026-09-05: pin 3.1.5 lama justru masih rentan (GHSA fast-uri host confusion/SSRF, aman >=3.1.6);
  # jalur 4.x (fastify langsung) aman >=4.1.3; deepmerge-ts 7.x lewat @prisma/config = stack exhaustion, aman >=8.
  fast-uri@^3.0.0: 3.1.7
  fast-uri@^4.0.0: 4.1.4
  deepmerge-ts@<8: 8.0.2
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  # Di darwin scripts/prebuild.js keluar 0 (prebuild ada) dan tidak ada yang dibangun.
  # Di linux tidak ada prebuild, jadi ia jatuh ke node-gyp rebuild. `true` benar di keduanya.
  node-pty: true
  prisma: true
minimumReleaseAgeExclude:
  - fastify@5.12.1
