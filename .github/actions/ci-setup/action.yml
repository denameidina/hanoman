# SPEC-853 · Setup job `typecheck` di validate.yml: toolchain → install → Prisma Client.
name: hanoman ci setup
description: Toolchain pnpm/node, dependensi terkunci, dan Prisma Client untuk job validasi.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        # Root package.json tak punya field `packageManager`, jadi versinya dipatok di sini.
        version: 11

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Checkout bersih TAK punya Prisma Client (ADR-0128): postinstall `@prisma/client` hanya mencari
    # skema di lokasi default dan menyerah dengan peringatan. Tanpa langkah ini typecheck exit 2
    # sebelum memeriksa kode.
    - run: pnpm db:generate
      shell: bash
